<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silambu.lk — The sound worn at the ankle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --paper:#FFFFFF;
  --bone:#F7F5F0;
  --bone-2:#F1EEE6;
  --ink:#14120F;
  --ink-solid:#000000;
  --graphite:#57534A;
  --line:#E6E2D6;
  --line-strong:#D2CBB8;
  --stock-in:#4B5A34;   --stock-in-bg:#F1F3EC;
  --stock-low:#8A6A2C;  --stock-low-bg:#FAF3E4;
  --stock-out:#7A3B34;  --stock-out-bg:#F8EEEC;
  --err:#8A3B34;
  --radius:2px;
  --radius-lg:4px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Jost',sans-serif; font-weight:400;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{ font-family:'Bodoni Moda',serif; font-weight:600; margin:0; }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; background:none; border:none; color:inherit; }
input,select,textarea{ font-family:inherit; color:inherit; }
img{ max-width:100%; display:block; }
::selection{ background:var(--ink); color:var(--paper); }
.mono{ font-family:'IBM Plex Mono',monospace; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

@keyframes marquee{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
@keyframes draw{ from{ stroke-dashoffset:1; } to{ stroke-dashoffset:0; } }
@keyframes riseIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes popIn{ from{ opacity:0; transform:scale(.97); } to{ opacity:1; transform:scale(1); } }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
}

/* ============================= TICKER + HEADER ============================= */
.ticker{ background:var(--ink); color:var(--bone); overflow:hidden; white-space:nowrap; height:34px; display:flex; align-items:center; }
.ticker-track{ display:inline-flex; animation:marquee 26s linear infinite; }
.ticker-track span{ display:inline-flex; align-items:center; font-size:11px; letter-spacing:2px; text-transform:uppercase; padding:0 22px; }
.ticker-track span::after{ content:"✦"; margin-left:22px; opacity:.5; font-size:9px; }

.header{
  position:sticky; top:0; z-index:30; background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 44px;
}
.logo{ display:flex; align-items:center; gap:9px; }
.logo svg{ width:24px; height:24px; }
.logo-word{ font-family:'Bodoni Moda',serif; font-style:italic; font-weight:600; font-size:22px; }
.logo-tld{ font-size:14px; color:var(--graphite); }
.nav{ display:flex; align-items:center; gap:2px; }
.nav a{ font-size:12.5px; letter-spacing:1px; text-transform:uppercase; padding:10px 16px; color:var(--graphite); border-radius:999px; transition:.15s; }
.nav a:hover{ color:var(--ink); background:var(--bone); }
.nav a.active{ color:var(--ink); background:var(--ink); color:var(--paper) !important; }
.head-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .icon-btn{ padding:9px; border-radius:999px; display:flex; position:relative; }
  .icon-btn:hover{ background:var(--bone); }
  .auth-btn{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); border-radius:999px; padding:9px 13px; font-size:11.5px; letter-spacing:1px; text-transform:uppercase; white-space:nowrap; }
  .auth-btn:hover{ background:var(--bone); }
  .auth-btn .avatar{ width:18px; height:18px; border-radius:50%; background:var(--ink); color:var(--paper); display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; }
.bag-count{ position:absolute; top:1px; right:1px; background:var(--ink); color:var(--paper); font-size:10px; min-width:15px; height:15px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

@media(max-width:860px){
  .header{ padding:14px 20px; }
  .nav{ display:none; }
}

/* ============================= HERO ============================= */
.hero{ position:relative; padding:96px 44px 60px; max-width:1320px; margin:0 auto; display:grid; grid-template-columns:1fr; }
.hero-eyebrow{ font-size:11.5px; letter-spacing:3px; text-transform:uppercase; color:var(--graphite); margin-bottom:20px; animation:riseIn .7s both; }
.hero-title{ font-size:clamp(42px,7.6vw,92px); line-height:1.02; font-style:italic; max-width:16ch; animation:riseIn .8s .05s both; }
.hero-flourish{ position:absolute; top:60px; right:6%; width:150px; opacity:.9; }
.hero-flourish path{ stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.6s .3s cubic-bezier(.4,0,.2,1) forwards; }
.hero-sub{ margin-top:26px; font-size:16px; line-height:1.65; color:var(--graphite); max-width:46ch; animation:riseIn .8s .12s both; }
.hero-actions{ margin-top:34px; display:flex; gap:14px; animation:riseIn .8s .18s both; }

.btn{ display:inline-flex; align-items:center; gap:9px; padding:14px 26px; font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase; border-radius:999px; border:1px solid var(--ink); transition:.18s; white-space:nowrap; }
.btn-ink{ background:var(--ink); color:var(--paper); }
.btn-ink:hover:not(:disabled){ background:#000; box-shadow:0 10px 22px -12px rgba(0,0,0,.5); }
.btn-line{ border-color:var(--line-strong); color:var(--ink); }
.btn-line:hover:not(:disabled){ border-color:var(--ink); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn-block{ width:100%; justify-content:center; }
.btn-sm{ padding:10px 18px; font-size:11px; }

/* ============================= WAVEFORM DIVIDER / MANIFESTO ============================= */
.manifesto{ background:var(--bone); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:70px 44px; }
.manifesto-inner{ max-width:1160px; margin:0 auto; }
.wave{ display:flex; align-items:flex-end; gap:3px; height:46px; margin-bottom:34px; }
.wave i{ display:block; width:3px; background:var(--ink); opacity:.75; border-radius:1px; }
.manifesto-grid{ display:grid; grid-template-columns:220px 1fr; gap:40px; }
.manifesto-label{ font-size:11.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--graphite); padding-top:6px; }
.manifesto-text{ font-family:'Bodoni Moda',serif; font-size:clamp(22px,2.6vw,32px); line-height:1.4; max-width:26ch; }
@media(max-width:760px){ .manifesto-grid{ grid-template-columns:1fr; gap:18px; } }

/* ============================= CATALOGUE ============================= */
.catalogue{ max-width:1320px; margin:0 auto; padding:80px 44px 20px; }
.cat-head{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:20px; margin-bottom:30px; }
.cat-head h2{ font-size:clamp(28px,3.4vw,42px); font-style:italic; }
.search-wrap{ display:flex; align-items:center; gap:9px; border-bottom:1px solid var(--line-strong); padding:8px 2px; min-width:230px; color:var(--graphite); }
.search-wrap input{ border:none; outline:none; background:transparent; font-size:14px; width:100%; color:var(--ink); }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:40px; border-top:1px solid var(--line); padding-top:22px; }
.chip{ padding:8px 17px; border-radius:999px; border:1px solid var(--line-strong); font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--graphite); transition:.15s; }
.chip:hover{ border-color:var(--ink); color:var(--ink); }
.chip.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(266px,1fr)); gap:2px; background:var(--line); border:1px solid var(--line); margin-bottom:20px; }
.card{ background:var(--paper); display:flex; flex-direction:column; animation:riseIn .5s both; }
.card-art{ position:relative; aspect-ratio:1/1.1; background:var(--bone); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.card-art svg{ width:44%; height:44%; color:var(--ink); transition:transform .5s cubic-bezier(.2,.8,.2,1); }
.card:hover .card-art svg{ transform:scale(1.08) rotate(-2deg); }
.card-addbar{ position:absolute; left:0; right:0; bottom:0; transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1); background:var(--ink); color:var(--paper); }
.card:hover .card-addbar{ transform:translateY(0); }
.card-addbar button{ width:100%; padding:13px; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; display:flex; align-items:center; justify-content:center; gap:8px; }
.card-addbar button:disabled{ opacity:.5; cursor:not-allowed; }
.card-body{ padding:18px 20px 22px; display:flex; flex-direction:column; gap:6px; flex:1; }
.card-cat{ font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--graphite); }
.card-name{ font-family:'Bodoni Moda',serif; font-size:19px; font-style:italic; text-align:left; }
.card-name:hover{ text-decoration:underline; text-underline-offset:3px; }
.card-price{ font-size:13px; margin-top:4px; }
.stock{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--graphite); margin-top:2px; }
.dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.dot-in{ background:var(--stock-in); } .dot-low{ background:var(--stock-low); } .dot-out{ background:var(--stock-out); }

.empty{ display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; color:var(--graphite); padding:70px 20px; }
.empty svg{ width:26px; height:26px; }

/* ============================= CRAFT ============================= */
.craft{ padding:90px 44px; max-width:1320px; margin:0 auto; }
.craft-head{ margin-bottom:50px; }
.craft-head .hero-eyebrow{ margin-bottom:14px; }
.craft-head h2{ font-size:clamp(26px,3.2vw,38px); font-style:italic; max-width:20ch; }
.craft-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:44px; }
.craft-step{ border-top:1px solid var(--ink); padding-top:20px; }
.craft-num{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--graphite); display:block; margin-bottom:16px; }
.craft-step h3{ font-size:19px; font-style:italic; margin-bottom:10px; }
.craft-step p{ font-size:14px; line-height:1.65; color:var(--graphite); }
@media(max-width:760px){ .craft-grid{ grid-template-columns:1fr; gap:34px; } }

/* ============================= FOOTER ============================= */
.footer{ border-top:1px solid var(--line); padding-top:60px; }
.footer-ghost{ text-align:center; padding:0 20px 40px; overflow:hidden; }
.footer-ghost span{ font-family:'Bodoni Moda',serif; font-style:italic; font-weight:600; font-size:clamp(56px,14vw,190px); color:var(--paper); -webkit-text-stroke:1px var(--line-strong); line-height:1; letter-spacing:2px; white-space:nowrap; }
.footer-cols{ max-width:1320px; margin:0 auto; padding:0 44px 50px; display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:40px; border-bottom:1px solid var(--line); padding-bottom:50px; }
.footer-head{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--graphite); margin-bottom:16px; }
.footer-line{ font-size:13.5px; color:var(--graphite); margin-bottom:9px; line-height:1.6; }
.footer-bottom{ max-width:1320px; margin:0 auto; padding:22px 44px 40px; display:flex; justify-content:space-between; font-size:12px; color:var(--line-strong); flex-wrap:wrap; gap:8px; }
@media(max-width:760px){ .footer-cols{ grid-template-columns:1fr; gap:26px; } }

/* ============================= PAGE (track / admin) ============================= */
.page{ max-width:560px; margin:0 auto; padding:70px 24px 110px; }
.page-wide{ max-width:1120px; margin:0 auto; padding:56px 44px 110px; }
.page-title{ font-size:clamp(28px,4vw,40px); font-style:italic; margin-bottom:12px; }
.page-sub{ font-size:15px; color:var(--graphite); line-height:1.6; margin-bottom:34px; max-width:44ch; }

/* forms */
.field{ display:flex; flex-direction:column; gap:7px; font-size:12px; letter-spacing:.5px; text-transform:uppercase; color:var(--graphite); margin-bottom:16px; }
.field em{ color:var(--err); font-style:normal; margin-left:2px; }
.field input, .field select, .field textarea{
  border:none; border-bottom:1px solid var(--line-strong); padding:10px 2px; font-size:15px; text-transform:none; letter-spacing:normal; background:transparent; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--ink); }
.field textarea{ resize:vertical; font-family:inherit; }
.row-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-error{ display:flex; gap:7px; align-items:center; color:var(--err); font-size:12.5px; margin:-4px 0 14px; }
@media(max-width:520px){ .row-2{ grid-template-columns:1fr; } }

/* ============================= OVERLAYS ============================= */
.overlay{ position:fixed; inset:0; background:rgba(20,18,15,.45); backdrop-filter:blur(2px); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; }
.overlay.right{ justify-content:flex-end; padding:0; }
.sheet{ background:var(--paper); width:100%; max-width:460px; max-height:88vh; overflow-y:auto; padding:34px; position:relative; border-radius:var(--radius-lg); animation:popIn .22s cubic-bezier(.2,.8,.2,1) both; }
.sheet-close{ position:absolute; top:16px; right:16px; }
.drawer{ background:var(--paper); width:min(420px,100%); height:100%; padding:28px; display:flex; flex-direction:column; animation:riseIn .25s both; }
.drawer-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.drawer-head h3{ font-size:21px; font-style:italic; }

.modal-title{ font-size:26px; font-style:italic; margin:4px 0 8px; }
.modal-price{ font-size:15px; margin-bottom:14px; }
.modal-desc{ font-size:14.5px; color:var(--graphite); line-height:1.65; margin-bottom:16px; }
.modal-art{ aspect-ratio:16/10; background:var(--bone); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; margin-bottom:20px; }
.modal-art svg{ width:70px; height:70px; }
.modal-actions{ display:flex; gap:12px; align-items:center; margin-top:20px; }

.stepper{ display:flex; align-items:center; border:1px solid var(--line-strong); border-radius:999px; }
.stepper button{ padding:9px 13px; } .stepper button:hover{ background:var(--bone); }
.stepper span{ min-width:22px; text-align:center; font-size:14px; font-family:'IBM Plex Mono',monospace; }
.stepper-sm button{ padding:6px 10px; }

/* cart drawer items */
.cart-items{ display:flex; flex-direction:column; gap:16px; overflow-y:auto; flex:1; }
.cart-item{ display:flex; gap:13px; border-bottom:1px solid var(--line); padding-bottom:16px; }
.cart-item-art{ width:50px; height:50px; background:var(--bone); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.cart-item-art svg{ width:22px; height:22px; }
.cart-item-info{ flex:1; }
.cart-item-name{ font-size:14px; margin-bottom:2px; }
.cart-item-price{ font-size:12.5px; color:var(--graphite); margin-bottom:8px; font-family:'IBM Plex Mono',monospace; }
.cart-foot{ border-top:1px solid var(--line); padding-top:18px; margin-top:16px; }
.cart-total{ display:flex; justify-content:space-between; margin-bottom:16px; font-size:15px; }
.cart-total strong{ font-family:'IBM Plex Mono',monospace; }

/* checkout */
.steps-row{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
.step-label{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--line-strong); }
.step-label.active{ color:var(--ink); }
.step-rule{ flex:1; height:1px; background:var(--line); }
.summary-row{ display:flex; justify-content:space-between; font-size:14px; padding:16px 0; border-top:1px solid var(--line); margin:6px 0 18px; }
.summary-row strong{ font-family:'IBM Plex Mono',monospace; }
.pay-opt{ display:flex; align-items:center; gap:13px; text-align:left; border:1px solid var(--line-strong); border-radius:var(--radius); padding:15px; width:100%; margin-bottom:10px; }
.pay-opt svg{ width:19px; height:19px; flex-shrink:0; }
.pay-opt strong{ display:block; font-size:14px; font-weight:500; }
.pay-opt span{ display:block; font-size:12px; color:var(--graphite); margin-top:2px; }
.pay-opt.active{ border-color:var(--ink); background:var(--bone); }
.pay-card-form{ border:1px solid var(--line-strong); border-radius:var(--radius); padding:16px; margin-bottom:16px; background:var(--bone); }
.pay-card-form .field{ margin-bottom:12px; }
.pay-card-form .field input{ border:1px solid var(--line-strong); border-radius:var(--radius); padding:10px 12px; background:var(--paper); }
.bank-box{ border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px; font-size:13px; }
.bank-box>p:first-child{ margin-bottom:10px; color:var(--graphite); }
.bank-row{ display:flex; justify-content:space-between; padding:5px 0; }
.bank-row strong{ font-family:'IBM Plex Mono',monospace; font-weight:500; }
.note{ display:flex; gap:7px; align-items:flex-start; font-size:12px; color:var(--graphite); margin:-4px 0 16px; line-height:1.5; }
.processing{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:54px 0; color:var(--graphite); font-size:14px; }
.spinner{ width:28px; height:28px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--ink); animation:spin .8s linear infinite; }

.confirm{ text-align:center; }
.confirm-check{ width:54px; height:54px; border-radius:50%; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; margin:2px auto 18px; }
.confirm-check svg{ width:22px; height:22px; }
.order-box{ background:var(--bone); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:3px; margin:18px 0 10px; }
.order-box span{ font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--graphite); }
.order-box strong{ font-family:'IBM Plex Mono',monospace; font-size:17px; letter-spacing:.5px; }
.confirm-hint{ font-size:12.5px; color:var(--graphite); line-height:1.6; margin-bottom:22px; }

/* ============================= TRACK ORDER ============================= */
.track-result{ margin-top:36px; border:1px solid var(--line); border-radius:var(--radius-lg); padding:28px; animation:riseIn .3s both; }
.track-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px; flex-wrap:wrap; gap:10px; }
.track-progress{ display:flex; align-items:center; margin-bottom:28px; }
.tstep{ display:flex; flex-direction:column; align-items:center; gap:9px; font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--line-strong); width:80px; text-align:center; }
.tstep.active{ color:var(--ink); }
.tstep i{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line-strong); display:flex; align-items:center; justify-content:center; }
.tstep.active i{ border-color:var(--ink); background:var(--ink); color:var(--paper); }
.tstep i svg{ width:12px; height:12px; }
.tline{ flex:1; height:1px; background:var(--line); margin-bottom:24px; }
.tline.active{ background:var(--ink); }
.track-items{ display:flex; flex-direction:column; gap:9px; font-size:13.5px; padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:16px; }
.track-item{ display:flex; justify-content:space-between; color:var(--graphite); }
.track-addr{ display:flex; gap:8px; font-size:13px; color:var(--graphite); align-items:flex-start; }
.track-addr svg{ width:14px; height:14px; flex-shrink:0; margin-top:2px; }

/* ============================= ADMIN ============================= */
.admin-gate{ text-align:center; padding-top:50px; display:flex; flex-direction:column; align-items:center; }
.admin-gate svg{ width:24px; height:24px; }
.admin-gate .page-sub{ margin:14px 0 22px; }
.admin-gate form{ width:100%; max-width:220px; }
.admin-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:30px; flex-wrap:wrap; gap:14px; }
.tabs{ display:flex; gap:26px; border-bottom:1px solid var(--line); margin-bottom:26px; }
.tab{ display:flex; align-items:center; gap:8px; padding:12px 2px; font-size:13px; letter-spacing:.5px; color:var(--graphite); border-bottom:2px solid transparent; margin-bottom:-1px; }
.tab.active{ color:var(--ink); border-color:var(--ink); }
.tab-count{ background:var(--bone); border:1px solid var(--line); border-radius:999px; font-size:10.5px; padding:1px 8px; font-family:'IBM Plex Mono',monospace; }
.toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:16px; flex-wrap:wrap; }

.table-wrap{ border:1px solid var(--line); border-radius:var(--radius-lg); overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:600px; }
th{ text-align:left; font-weight:500; color:var(--graphite); font-size:10.5px; text-transform:uppercase; letter-spacing:1px; padding:14px 18px; background:var(--bone); border-bottom:1px solid var(--line); }
td{ padding:14px 18px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
.t-name{ font-weight:500; }
.t-sub{ color:var(--graphite); font-size:12px; }
.t-actions{ display:flex; gap:2px; }
.t-empty{ text-align:center; color:var(--graphite); padding:34px; }
.status-select{ border:1px solid var(--line-strong); border-radius:var(--radius); padding:7px 10px; font-size:12.5px; background:var(--paper); }

/* ============================= TOAST ============================= */
.toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:12px 24px; border-radius:999px; font-size:13px; z-index:100; animation:popIn .2s both; letter-spacing:.3px; }

/* reveal-on-scroll */
[data-reveal]{ opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1); }
[data-reveal].seen{ opacity:1; transform:translateY(0); }

.loading-screen{ min-height:60vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:var(--graphite); font-size:13px; letter-spacing:1px; text-transform:uppercase; }
</style>
</head>
<body>

<div class="ticker" aria-hidden="true">
  <div class="ticker-track" id="ticker-track"></div>
</div>

<header class="header">
  <a href="#" class="logo" aria-label="Silambu.lk home">
    <svg viewBox="0 0 60 60"><path d="M10 40C10 24 24 10 38 9C50 8 55 20 45 27C35 34 20 30 20 42C20 52 35 55 50 50" stroke="var(--ink)" stroke-width="6.5" stroke-linecap="round" fill="none"/></svg>
    <span class="logo-word">silambu</span><span class="logo-tld">.lk</span>
  </a>
  <nav class="nav" id="nav-links">
    <a href="#" data-view="shop">Shop</a>
    <a href="#track" data-view="track">Track Order</a>
    <a href="#admin" data-view="admin">Admin</a>
  </nav>
  <div class="head-right">
    <button class="auth-btn" id="auth-btn" data-action="auth-toggle" type="button">Sign in with Google</button>
    <button class="icon-btn" data-action="open-cart" aria-label="Open bag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><path d="M6 8h12l-1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="bag-count" id="bag-count" style="display:none;">0</span>
    </button>
  </div>
</header>

<main id="app">
  <div class="loading-screen">Preparing the collection…</div>
</main>

<footer class="footer" id="site-footer"></footer>
<div id="overlay-root"></div>
<div id="toast-root"></div>

<script>
/* =========================================================================
   SILAMBU.LK — high-end single-file storefront (no build step required)
   Vanilla HTML/CSS/JS. Products & orders persist to Supabase if configured
   below; otherwise falls back to this browser's localStorage, and finally
   to in-memory state only (e.g. inside a sandboxed preview).
   ========================================================================= */

/* ---- 1. Fill these in once you've created your Supabase project ---- */
const SUPABASE_URL = "";       // e.g. "https://xxxx.supabase.co"
const SUPABASE_ANON_KEY = "";  // your Supabase "anon public" key

let supa = null;
try {
  if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) { supa = null; }

/* ------------------------------- data ------------------------------- */
const SEED_PRODUCTS = [
  { id:"p1", name:"Ganga Silver Silambu", category:"Classic", price:8500, stock:12, icon:"ring",
    desc:"A traditional pair of silver-toned anklets with a soft, layered chime — cast the way our grandmothers wore them, for every day." },
  { id:"p2", name:"Kandiyan Nrithya Set", category:"Dance", price:14200, stock:6, icon:"bells",
    desc:"Performance-weight ghungroo anklets built for Kandyan dance — dense bell rows, tight stitching, a clear resonant strike." },
  { id:"p3", name:"Ruwan Bridal Pair", category:"Bridal", price:21800, stock:3, icon:"facet",
    desc:"Our most detailed pair — fine filigree links and a hand-set centre stone, made for the wedding morning." },
  { id:"p4", name:"Podi Kella Anklet", category:"Children", price:3200, stock:20, icon:"bloom",
    desc:"A lighter, child-sized silambu with a gentle chime — sized for small ankles, made to last through a childhood of dancing." },
  { id:"p5", name:"Bharatha Ghungroo — 100 Bell", category:"Dance", price:17600, stock:0, icon:"chime",
    desc:"A full hundred-bell training pair for Bharatanatyam students, tuned for a crisp, even sound on every adavu." },
  { id:"p6", name:"Nilame Formal Pair", category:"Classic", price:11400, stock:9, icon:"star",
    desc:"A quieter, formal-wear anklet with a narrow band and understated chime, suited to sarees and formal occasions." },
];
const ICON_OPTIONS = [
  ["ring","Band / Ring"], ["bells","Anklet Bells"], ["chime","Dense Chime"],
  ["facet","Faceted Gem"], ["bloom","Bloom"], ["star","Sparkle"]
];
const CATEGORY_OPTIONS = ["Classic","Dance","Bridal","Children"];
const ALL_STATUSES = ["Pending Payment","Processing","Shipped","Delivered"];
const TRACK_STEPS = ["Processing","Shipped","Delivered"];
const BANK = { bank:"Sample Bank of Ceylon", accountName:"Silambu.lk (Pvt) Ltd", accountNumber:"0123 4567 8910", branch:"Negombo" };

/* ------------------------------ helpers ------------------------------ */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const fmt = n => "Rs. " + Number(n||0).toLocaleString("en-LK");
const uid = p => (p + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4)).toUpperCase();
function esc(str){ return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const root = $("#toast-root");
  root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { root.innerHTML = ""; }, 2400);
}

/* -------------------------------- icons -------------------------------- */
function ui(name, size=18){
  const P = {
    close:'<path d="M6 6L18 18M18 6L6 18"/>',
    search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20L15.3 15.3"/>',
    plus:'<path d="M12 5V19M5 12H19"/>',
    minus:'<path d="M5 12H19"/>',
    trash:'<path d="M5 7H19M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M8 7l1 12a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1l1-12"/>',
    check:'<path d="M4 12l5 5L20 6"/>',
    chevronRight:'<path d="M9 5l7 7-7 7"/>',
    chevronLeft:'<path d="M15 5l-7 7 7 7"/>',
    lock:'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    creditCard:'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M4 10h16"/>',
    pencil:'<path d="M4 20h4L19.5 8.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 16v4Z"/>',
    alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
    grid:'<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',
    clipboard:'<rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 11h6M9 15h6"/>',
    logout:'<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M15 16l4-4-4-4M19 12H9"/>',
    arrowUp:'<path d="M7 17L17 7M8 7h9v9"/>',
    pin:'<path d="M12 21s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/>',
    truck:'<rect x="2" y="8" width="13" height="9" rx="1"/><path d="M15 11h3l3 3v3h-6v-6Z"/><circle cx="7" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/>',
    landmark:'<path d="M3 10l9-6 9 6M4 10v9M20 10v9M9 10v9M15 10v9M2 21h20"/>',
    bag:'<path d="M6 8h12l-1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    google:'<path d="M21 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.2a4.4 4.4 0 0 1-1.9 2.9v2.4h3.1c1.8-1.7 2.8-4.2 2.8-7.1Z"/><path d="M12 22c2.6 0 4.8-.8 6.4-2.2l-3.1-2.4c-.8.5-1.9.9-3.3.9-2.5 0-4.7-1.7-5.4-4H3.4v2.5A10 10 0 0 0 12 22Z"/><path d="M6.6 13.3A6.1 6.1 0 0 1 12 6.8c1.4 0 2.7.5 3.7 1.4l2.8-2.8A9.9 9.9 0 0 0 3.4 7.1L6.6 9.6Z"/>',
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="${size}" height="${size}">${P[name]||""}</svg>`;
}
function productIcon(name, size=44){
  const P = {
    ring:'<circle cx="24" cy="24" r="15"/><circle cx="24" cy="24" r="8.5"/>',
    bells:'<path d="M9 19Q24 4 39 19"/><circle cx="13" cy="26" r="3.4"/><circle cx="24" cy="30" r="3.4"/><circle cx="35" cy="26" r="3.4"/>',
    chime:'<path d="M6 18Q24 2 42 18"/><circle cx="10" cy="25" r="2.8"/><circle cx="18.4" cy="29" r="2.8"/><circle cx="24" cy="30.5" r="2.8"/><circle cx="29.6" cy="29" r="2.8"/><circle cx="38" cy="25" r="2.8"/>',
    facet:'<path d="M13 17 L24 7 L35 17 L24 41 Z"/><path d="M13 17 L35 17"/><path d="M18.3 17 L24 41"/><path d="M29.7 17 L24 41"/>',
    bloom:'<circle cx="24" cy="24" r="4.5"/><ellipse cx="24" cy="12" rx="5" ry="8"/><ellipse cx="24" cy="36" rx="5" ry="8"/><ellipse cx="12" cy="24" rx="8" ry="5"/><ellipse cx="36" cy="24" rx="8" ry="5"/>',
    star:'<path d="M24 6 L27.5 20.5 L42 24 L27.5 27.5 L24 42 L20.5 27.5 L6 24 L20.5 20.5 Z"/>',
  };
  return `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="${size}" height="${size}">${P[name]||P.ring}</svg>`;
}
function stockDot(stock){
  if (stock<=0) return `<span class="stock"><i class="dot dot-out"></i>Out of stock</span>`;
  if (stock<=4) return `<span class="stock"><i class="dot dot-low"></i>Only ${stock} left</span>`;
  return `<span class="stock"><i class="dot dot-in"></i>In stock</span>`;
}
function waveformBars(n=64){
  let out = "";
  for (let i=0;i<n;i++){
    const h = 8 + Math.abs(Math.sin(i*0.45)) * 30 + Math.abs(Math.sin(i*1.7))*6;
    out += `<i style="height:${h.toFixed(1)}px"></i>`;
  }
  return out;
}

/* --------------------------- persistence layer --------------------------- */
async function dbLoad(table){
  if (supa){
    try{
      const orderCol = table === "orders" ? "placed_at" : "name";
      const { data, error } = await supa.from(table).select("*").order(orderCol, { ascending: table !== "orders" });
      if (!error && data) return data;
    }catch(e){}
  }
  try{ const raw = localStorage.getItem("silambu_"+table); if (raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function dbCacheLocal(table, rows){ try{ localStorage.setItem("silambu_"+table, JSON.stringify(rows)); }catch(e){} }
async function dbUpsertProduct(p){
  if (supa){ try{ await supa.from("products").upsert({ id:p.id, name:p.name, category:p.category, price:p.price, stock:p.stock, icon:p.icon, desc:p.desc }); }catch(e){} }
}
async function dbDeleteProduct(id){
  if (supa){ try{ await supa.from("products").delete().eq("id", id); }catch(e){} }
}
async function dbInsertOrder(o){
  if (supa){ try{ await supa.from("orders").insert({ id:o.id, items:o.items, total:o.total, shipping:o.shipping, status:o.status, payment_method:o.paymentMethod, placed_at:o.placedAt }); }catch(e){} }
}
async function dbUpdateOrderStatus(id, status){
  if (supa){ try{ await supa.from("orders").update({ status }).eq("id", id); }catch(e){} }
}
async function dbUpdateStock(id, stock){
  if (supa){ try{ await supa.from("products").update({ stock }).eq("id", id); }catch(e){} }
}

/* --------------------------------- state --------------------------------- */
let PRODUCTS = [];
let ORDERS = [];
let CART = [];
let VIEW = "shop";
let FILTER = { query:"", category:"All" };
let ADMIN_AUTHED = false;
let ADMIN_TAB = "products";
let LAST_ORDER = null;
let CURRENT_USER = null;

function cartCount(){ return CART.reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return CART.reduce((s,i)=>s+i.qty*i.price,0); }
function saveCart(){ try{ localStorage.setItem("silambu_cart", JSON.stringify(CART)); }catch(e){} }
function loadCart(){ try{ const r = localStorage.getItem("silambu_cart"); return r? JSON.parse(r):[]; }catch(e){ return []; } }

function updateBagCount(){
  const el = $("#bag-count"); const n = cartCount();
  el.textContent = n; el.style.display = n>0 ? "flex" : "none";
}

function renderAuthButton(){
  const el = $("#auth-btn");
  if (!el) return;
  if (!CURRENT_USER){
    el.innerHTML = `${ui('google',16)} <span>Sign in with Google</span>`;
    return;
  }
  const name = CURRENT_USER.user_metadata?.full_name || CURRENT_USER.user_metadata?.name || CURRENT_USER.email || "Account";
  const initial = String(name).trim().charAt(0).toUpperCase() || "A";
  el.innerHTML = `<span class="avatar">${esc(initial)}</span><span>${esc(name)}</span>`;
}

async function signInWithGoogle(){
  if (!supa || !supa.auth){ toast("Google sign-in is ready once Supabase is configured."); return; }
  try {
    const redirect = window.location.origin + window.location.pathname;
    await supa.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: redirect } });
  } catch (e) {
    toast("Google sign-in could not be started.");
  }
}

async function signOut(){
  if (!supa || !supa.auth){ CURRENT_USER = null; renderAuthButton(); toast("Signed out"); return; }
  try { await supa.auth.signOut(); } catch (e) {} 
  CURRENT_USER = null; renderAuthButton(); toast("Signed out");
}

function applySignedInUser(user){
  CURRENT_USER = user || null;
  renderAuthButton();
  if (CURRENT_USER && !CHECKOUT_SHIPPING?.email){
    CHECKOUT_SHIPPING = { ...(CHECKOUT_SHIPPING || {}), name: CURRENT_USER.user_metadata?.full_name || CURRENT_USER.user_metadata?.name || CHECKOUT_SHIPPING?.name || "", email: CURRENT_USER.email || CHECKOUT_SHIPPING?.email || "" };
    if (CHECKOUT_STEP === 2 && $("#checkout-sheet")) refreshCheckout();
  }
}

async function initAuth(){
  if (!supa || !supa.auth) return;
  try {
    const { data } = await supa.auth.getSession();
    applySignedInUser(data?.session?.user || null);
    supa.auth.onAuthStateChange((_event, session) => {
      applySignedInUser(session?.user || null);
    });
  } catch (e) {}
}

/* ------------------------------ cart actions ------------------------------ */
function addToCart(product, qty=1){
  const found = CART.find(i=>i.id===product.id);
  if (found){ found.qty = Math.min(found.qty+qty, product.stock); }
  else { CART.push({ id:product.id, name:product.name, price:product.price, qty:Math.min(qty, product.stock) }); }
  saveCart(); updateBagCount();
  toast(`Added ${product.name} to your bag`);
  openCart();
}
function cartQty(id, delta){
  const item = CART.find(i=>i.id===id); if (!item) return;
  const p = PRODUCTS.find(pp=>pp.id===id); const max = p ? p.stock : 99;
  item.qty = Math.max(0, Math.min(item.qty+delta, max));
  CART = CART.filter(i=>i.qty>0);
  saveCart(); updateBagCount(); renderCartDrawer();
}
function cartRemove(id){ CART = CART.filter(i=>i.id!==id); saveCart(); updateBagCount(); renderCartDrawer(); }

/* ==================================================================
   INIT
   ================================================================== */
async function init(){
  const tickerPhrases = ["Handcrafted in Sri Lanka","Island-wide delivery","Made to order","Finished &amp; tuned by hand"];
  $("#ticker-track").innerHTML = (tickerPhrases.concat(tickerPhrases)).map(t=>`<span>${t}</span>`).join("");

  const p = await dbLoad("products");
  if (p && p.length){ PRODUCTS = p.map(x=>({ ...x, desc: x.desc ?? x.description })); }
  else { PRODUCTS = SEED_PRODUCTS.slice(); dbCacheLocal("products", PRODUCTS); for (const sp of PRODUCTS) await dbUpsertProduct(sp); }

  const o = await dbLoad("orders");
  ORDERS = (o || []).map(x => ({ ...x, placedAt: x.placedAt ?? x.placed_at, paymentMethod: x.paymentMethod ?? x.payment_method }))
                     .sort((a,b)=> new Date(b.placedAt) - new Date(a.placedAt));

  CART = loadCart();
  updateBagCount();
  renderAuthButton();
  await initAuth();
  route();
}

/* ==================================================================
   ROUTER
   ================================================================== */
function parseView(){
  const h = location.hash.replace("#","");
  return ["track","admin"].includes(h) ? h : "shop";
}
function route(){
  VIEW = parseView();
  $$("#nav-links a").forEach(a => a.classList.toggle("active", a.dataset.view===VIEW));
  if (VIEW==="shop") renderShop();
  else if (VIEW==="track") renderTrack();
  else renderAdmin();
  renderFooter();
  window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
  setupReveal();
}
window.addEventListener("hashchange", route);

/* ==================================================================
   SHOP VIEW
   ================================================================== */
function renderShop(){
  const app = $("#app");
  app.innerHTML = `
    <section class="hero">
      <svg class="hero-flourish" viewBox="0 0 150 90" fill="none"><path d="M6 50C6 30 30 8 56 7C76 6 84 22 70 30C56 38 34 34 34 50C34 64 58 70 82 63" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/></svg>
      <p class="hero-eyebrow">Handcrafted in Sri Lanka</p>
      <h1 class="hero-title">The sound worn<br>at the ankle.</h1>
      <p class="hero-sub">Silambu.lk casts each pair by hand — dense-bell ghungroo for the stage, quiet silver for every day, and fine bridal sets for the morning that matters.</p>
      <div class="hero-actions">
        <a href="#collection" class="btn btn-ink">Enter the collection ${ui('arrowUp',15)}</a>
      </div>
    </section>

    <section class="manifesto" data-reveal>
      <div class="manifesto-inner">
        <div class="wave" aria-hidden="true">${waveformBars(70)}</div>
        <div class="manifesto-grid">
          <p class="manifesto-label">Our craft</p>
          <p class="manifesto-text">Silambu has always been an instrument as much as an ornament — finished in small batches, its bells tuned by ear until the chime rings even, so what you wear quietly sings.</p>
        </div>
      </div>
    </section>

    <section class="catalogue" id="collection">
      <div class="cat-head" data-reveal>
        <h2>The collection</h2>
        <div class="search-wrap">
          ${ui('search',15)}
          <input id="search-input" placeholder="Search anklets…" autocomplete="off">
        </div>
      </div>
      <div class="chip-row" id="chip-row"></div>
      <div class="grid" id="product-grid"></div>
    </section>

    <section class="craft" data-reveal>
      <div class="craft-head">
        <p class="hero-eyebrow">Bench to box</p>
        <h2>Three steps, every pair, no exceptions.</h2>
      </div>
      <div class="craft-grid">
        <div class="craft-step"><span class="craft-num mono">01</span><h3>Cast</h3><p>Sterling-finished pieces are cast from hand-carved moulds, one pour at a time.</p></div>
        <div class="craft-step"><span class="craft-num mono">02</span><h3>Finish</h3><p>Every link and clasp is filed, polished, and inspected by hand before it leaves the bench.</p></div>
        <div class="craft-step"><span class="craft-num mono">03</span><h3>Tune</h3><p>For dance pairs, each bell is seated and adjusted until the chime rings true and even.</p></div>
      </div>
    </section>
  `;

  updateChips();
  updateGrid();
  $("#search-input").addEventListener("input", e => { FILTER.query = e.target.value; updateGrid(); });
}

function updateChips(){
  const cats = ["All", ...new Set(PRODUCTS.map(p=>p.category))];
  $("#chip-row").innerHTML = cats.map(c =>
    `<button class="chip ${FILTER.category===c?'active':''}" data-action="set-category" data-cat="${esc(c)}">${esc(c)}</button>`
  ).join("");
}

function filteredProducts(){
  return PRODUCTS.filter(p =>
    (FILTER.category==="All" || p.category===FILTER.category) &&
    p.name.toLowerCase().includes(FILTER.query.toLowerCase())
  );
}

function updateGrid(){
  const list = filteredProducts();
  const grid = $("#product-grid");
  if (!grid) return;
  if (list.length===0){
    grid.style.background = "none"; grid.style.border = "none";
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">${ui('alert',26)}<p>No pieces match “${esc(FILTER.query)}”. Try another search or category.</p></div>`;
    return;
  }
  grid.style.background = ""; grid.style.border = "";
  grid.innerHTML = list.map(productCard).join("");
}

function productCard(p){
  return `
    <article class="card">
      <div class="card-art">
        <button data-action="open-product" data-id="${p.id}" aria-label="View ${esc(p.name)}" style="display:contents;">${productIcon(p.icon)}</button>
        <div class="card-addbar">
          <button data-action="add-to-cart" data-id="${p.id}" ${p.stock<=0?'disabled':''}>
            ${p.stock<=0 ? 'Unavailable' : 'Add to bag'}
          </button>
        </div>
      </div>
      <div class="card-body">
        <p class="card-cat">${esc(p.category)}</p>
        <button class="card-name" data-action="open-product" data-id="${p.id}">${esc(p.name)}</button>
        <p class="card-price mono">${fmt(p.price)}</p>
        ${stockDot(p.stock)}
      </div>
    </article>`;
}

/* ==================================================================
   PRODUCT MODAL
   ================================================================== */
let MODAL_QTY = 1;
function openProduct(id){
  const p = PRODUCTS.find(x=>x.id===id); if (!p) return;
  MODAL_QTY = 1;

async function placeOrder(paymentData={}){
  $("#checkout-sheet").innerHTML = `<div class="processing"><div class="spinner"></div><p>Processing your payment…</p></div>`;
  await new Promise(r=>setTimeout(r, 700));

  const order = {
    id: "SLB-" + uid(""),
    items: CART.slice(),
    total: cartTotal(),
    shipping: CHECKOUT_SHIPPING,
    paymentMethod: CHECKOUT_METHOD,
    paymentDetails: CHECKOUT_METHOD==="online" ? { cardHolder: paymentData.cardName||"", last4: String(paymentData.cardNumber||"").replace(/\D/g,"").slice(-4) } : null,
    status: CHECKOUT_METHOD==="bank" ? "Pending Payment" : "Processing",
    placedAt: new Date().toISOString(),
  };
  await dbInsertOrder(order);
  ORDERS.unshift(order);
  dbCacheLocal("orders", ORDERS);

  for (const item of CART){
    const p = PRODUCTS.find(pp=>pp.id===item.id);
    if (p){ p.stock = Math.max(0, p.stock - item.qty); await dbUpdateStock(p.id, p.stock); }
  }
  dbCacheLocal("products", PRODUCTS);

  CART = []; saveCart(); updateBagCount();
  LAST_ORDER = order;
  closeOverlay();
  openConfirmation();
}

function trackSearch(id, email){
  const found = ORDERS.find(o => o.id.toLowerCase()===id.trim().toLowerCase() && (o.shipping.email||'').toLowerCase()===email.trim().toLowerCase());
  const box = $("#track-result");

    box.innerHTML = `<div class="empty" style="margin-top:32px;">${ui('alert',24)}<p>No order matches that ID and email. Double-check and try again.</p></div>`;
    return;
  }
  const stepIndex = TRACK_STEPS.indexOf(found.status);
  const stepsHtml = TRACK_STEPS.map((s,i)=>{
    const active = i<=stepIndex;
    const icon = i<stepIndex ? ui('check',12) : (i===stepIndex ? ui('truck',12) : '');
    const line = i<TRACK_STEPS.length-1 ? `<div class="tline ${i<stepIndex?'active':''}"></div>` : '';
    return `<div class="tstep ${active?'active':''}"><i>${icon}</i><span>${s}</span></div>${line}`;
  }).join("");
  const itemsHtml = found.items.map(it=>`<div class="track-item"><span>${it.qty} × ${esc(it.name)}</span><span class="mono">${fmt(it.qty*it.price)}</span></div>`).join("");

  box.innerHTML = `
    <div class="track-result">
      <div class="track-top">
        <div><p class="card-cat">Order ${found.id}${found.status==='Pending Payment' ? ' · Pending payment' : ''}</p><p class="page-sub" style="margin:2px 0 0;">Placed ${dateStr}</p></div>

      <div class="track-items">${itemsHtml}</div>
      <div class="track-addr">${ui('pin',14)}<span>${esc(found.shipping.address)}, ${esc(found.shipping.city)}</span></div>
    </div>`;
}

   EVENT DELEGATION
   ================================================================== */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-view]");
  if (nav){ /* let default hash link navigate */ }

  const t = e.target.closest("[data-action]");
  if (!t) return;
  const action = t.dataset.action;

  if (action==="overlay-bg" && e.target===t) return closeOverlay();
  if (action==="close-overlay") return closeOverlay();
  if (action==="auth-toggle") return CURRENT_USER ? signOut() : signInWithGoogle();
  if (action==="open-cart") return openCart();
  if (action==="open-product"){ CURRENT_MODAL_ID = t.dataset.id; return openProduct(t.dataset.id); }
  if (action==="add-to-cart"){ const p = PRODUCTS.find(x=>x.id===t.dataset.id); if (p && p.stock>0) addToCart(p,1); return; }
  if (action==="modal-add"){ const p = PRODUCTS.find(x=>x.id===t.dataset.id); if (p) addToCart(p, MODAL_QTY); return; }
  if (action==="modal-qty"){ modalQty(Number(t.dataset.delta)); return; }
  if (action==="set-category"){ FILTER.category = t.dataset.cat; updateChips(); updateGrid(); return; }
  if (action==="cart-inc"){ return cartQty(t.dataset.id, 1); }
  if (action==="cart-dec"){ return cartQty(t.dataset.id, -1); }
  if (action==="cart-remove"){ return cartRemove(t.dataset.id); }
  if (action==="go-checkout"){ return openCheckout(); }
  if (action==="checkout-back"){ CHECKOUT_STEP=1; return refreshCheckout(); }
  if (action==="select-method"){ CHECKOUT_METHOD = t.dataset.method; return refreshCheckout(); }
  if (action==="goto-track"){ closeOverlay(); LAST_ORDER=null; location.hash="track"; return; }
  if (action==="admin-signout"){ ADMIN_AUTHED=false; return renderAdmin(); }
  if (action==="admin-tab"){ ADMIN_TAB = t.dataset.tab; return renderAdminBody(); }
  if (action==="admin-add-product"){ return openProductEditor(null); }
  if (action==="admin-edit-product"){ return openProductEditor(t.dataset.id); }
  if (action==="admin-delete-product"){
    if (!confirm("Remove this product from the catalogue?")) return;
    dbDeleteProduct(t.dataset.id);
    PRODUCTS = PRODUCTS.filter(p=>p.id!==t.dataset.id);
    dbCacheLocal("products", PRODUCTS);
    renderAdmin();
    toast("Product removed");
    return;
  }
});

document.addEventListener("change", e => {
  if (e.target.dataset.action==="order-status"){
    const id = e.target.dataset.id, status = e.target.value;
    dbUpdateOrderStatus(id, status);
    const o = ORDERS.find(x=>x.id===id); if (o) o.status = status;
    dbCacheLocal("orders", ORDERS);
    toast(`Order ${id} marked ${status}`);
  }
});

document.addEventListener("submit", e => {
  const form = e.target;
  if (!form.dataset.form) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());

  if (form.dataset.form==="shipping"){
    if (!data.name || !data.email || !data.phone || !data.address || !data.city) return;
    CHECKOUT_SHIPPING = data; CHECKOUT_STEP = 2; return refreshCheckout();
  }
  if (form.dataset.form==="payment"){
    if (CHECKOUT_METHOD==="online" && (!data.cardName || !data.cardNumber || !data.cardExpiry || !data.cardCvv)) {
      toast("Please complete the card details before placing your order.");
      return;
    }
    return placeOrder(data);
  }
  if (form.dataset.form==="track"){ return trackSearch(data.id, data.email); }
  if (form.dataset.form==="admin-pin"){
    if (data.pin==="1234"){ ADMIN_AUTHED=true; renderAdmin(); }
    else toast("Incorrect PIN");
    return;
  }
  if (form.dataset.form==="product-editor"){
    const editing = form.dataset.editing==="1";
    const product = {
      id: form.dataset.id, name: data.name.trim(), category: data.category,
      price: Number(data.price)||0, stock: Number(data.stock)||0, icon: data.icon, desc: data.desc.trim(),
    };
    dbUpsertProduct(product);
    if (editing){ PRODUCTS = PRODUCTS.map(p=>p.id===product.id?product:p); }
    else { PRODUCTS.unshift(product); }
    dbCacheLocal("products", PRODUCTS);
    closeOverlay();
    if (VIEW==="admin") renderAdmin();
    toast("Product saved");
    return;
  }
});

  const els = $$("[data-reveal]");
  if (!els.length) return;
  if (!("IntersectionObserver" in window)){ els.forEach(el=>el.classList.add("seen")); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en => { if (en.isIntersecting){ en.target.classList.add("seen"); io.unobserve(en.target); } });
  }, { threshold:0.15 });
  els.forEach(el=>io.observe(el));
}

init();
</script>
</body>
</html>
